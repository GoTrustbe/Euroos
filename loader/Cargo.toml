[package]
name = "loader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroOS twee-traps A/B-loader (G4): leest slot_config en laadt de kernel uit het gekozen slot via UEFI LoadImage/StartImage."

[[bin]]
name = "loader"
path = "src/main.rs"

[dependencies]
uefi = { version = "0.33", features = ["alloc", "global_allocator", "panic_handler"] }
euroupdate = { path = "../crates/euroupdate" }
