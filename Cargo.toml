# EuroKernel — workspace root
# Logica-crates (default-members) worden met `cargo test` op de host getest.
# De kernel-binary bouw je apart met `cargo kbuild` (zie .cargo/config.toml),
# want die target x86_64-unknown-uefi en is no_std/no_main.
[workspace]
resolver = "2"
members = ["kernel", "loader", "crates/eurofs", "crates/euronet", "crates/euromm", "crates/eurotls", "crates/euroupdate", "crates/eurosandbox", "crates/eurodisplay", "crates/eurowasm", "crates/eurowl", "crates/euroaudio", "crates/europrint", "crates/eurousb", "crates/euroacpi", "crates/euroaml", "crates/eurodevice", "crates/eurotpm", "crates/eurofde", "crates/europol", "crates/euroobserve", "crates/eurovault", "crates/eurocrash", "crates/eurohealth", "crates/eurofw", "crates/eurovpn", "crates/eurocoreutils", "crates/euroagent", "crates/eurolocale", "crates/euroinstall", "crates/euroca", "crates/euroattest", "crates/euroidm", "crates/euroid", "crates/europkg", "crates/eurorepro", "crates/euroaccess", "crates/eurodoc", "crates/eurodocio", "crates/eurocalc", "crates/eurowifi", "crates/eurogpu", "crates/euroweb", "crates/euroreken", "crates/euronotes", "crates/euroarchive", "crates/eurosafe", "crates/eurofiles", "crates/euromedia", "crates/euroclip", "crates/euroclock", "crates/euroshot", "crates/eurocontacts", "crates/eurocalendar", "crates/eurosign", "crates/euromusic", "crates/euromail", "crates/eurofont", "crates/eurojs"]
default-members = ["crates/eurofs", "crates/euronet", "crates/euromm", "crates/eurotls", "crates/euroupdate", "crates/eurosandbox", "crates/eurodisplay", "crates/eurowasm", "crates/eurowl", "crates/euroaudio", "crates/europrint", "crates/eurousb", "crates/euroacpi", "crates/euroaml", "crates/eurodevice", "crates/eurotpm", "crates/eurofde", "crates/europol", "crates/euroobserve", "crates/eurovault", "crates/eurocrash", "crates/eurohealth", "crates/eurofw", "crates/eurovpn", "crates/eurocoreutils", "crates/euroagent", "crates/eurolocale", "crates/euroinstall", "crates/euroca", "crates/euroattest", "crates/euroidm", "crates/euroid", "crates/europkg", "crates/eurorepro", "crates/euroaccess", "crates/eurodoc", "crates/eurodocio", "crates/eurocalc", "crates/eurowifi", "crates/eurogpu", "crates/euroweb", "crates/euroreken", "crates/euronotes", "crates/euroarchive", "crates/eurosafe", "crates/eurofiles", "crates/euromedia", "crates/euroclip", "crates/euroclock", "crates/euroshot", "crates/eurocontacts", "crates/eurocalendar", "crates/eurosign", "crates/euromusic", "crates/euromail", "crates/eurofont", "crates/eurojs"]

[workspace.package]
edition = "2021"
license = "EUPL-1.2"
authors = ["EuroKernel BV <contact@eurokernel.eu>"]
repository = "https://gitea.eurokernel.eu/eurokernel/os"
rust-version = "1.85"

# Grootte-geoptimaliseerd; panic=abort wordt voor de UEFI-target afgedwongen
# via rustflags in .cargo/config.toml (niet hier, zodat host-tests blijven
# unwinden en #[should_panic] werkt).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
