# EuroOS live-try: server-block locations (installed to /etc/nginx/snippets/eurovnc.conf
# and included inside the euro-os.eu :443 server block by deploy-eurovnc.sh).

# 1) Session launcher -> orchestrator (127.0.0.1:6070).
location = /api/launch {
    limit_req zone=eurovnc burst=3 nodelay;
    proxy_pass http://127.0.0.1:6070;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# 2) A bare session token -> open the noVNC viewer wired to that token.
#    token_urlsafe(18) is 24 URL-safe chars; the single-segment pattern never
#    matches noVNC asset paths (they contain "." or extra "/") or /vnc/websockify.
location ~ "^/vnc/(?<eurovnc_tok>[A-Za-z0-9_-]{16,64})$" {
    return 302 "/vnc/vnc.html?autoconnect=true&resize=scale&reconnect=true&show_dot=true&path=vnc/websockify%3Ftoken%3D$eurovnc_tok";
}

# 3) noVNC client assets + the websocket -> websockify (127.0.0.1:6080).
location /vnc/ {
    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
