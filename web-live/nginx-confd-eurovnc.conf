# EuroOS live-try: http-level helpers (installed to /etc/nginx/conf.d/eurovnc.conf).
# conf.d/*.conf is included inside the http{} block by the stock nginx.conf.

# WebSocket upgrade plumbing for the noVNC proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate-limit session launches per client IP (defense in depth; the orchestrator
# also enforces a per-IP cooldown and a global concurrency cap).
limit_req_zone $binary_remote_addr zone=eurovnc:10m rate=6r/m;
