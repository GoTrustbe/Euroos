[package]
name = "eurovault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroVault — capability-gated, versleutelde secrets-store (plan U). no_std, host-testbaar."

[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# AF / PCR-seal: KDF die de ontzegelsleutel aan de boot-meting (PCR-digest) bindt.
sha2 = { version = "0.10", default-features = false }

[features]
default = []
