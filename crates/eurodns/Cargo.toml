[package]
name = "eurodns"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroDNS — DNS message model (A/AAAA) + DNSSEC validation (Ed25519, RFC 8080: RRSIG verify + DS chain). Sovereign, privacy-first resolution. no_std, host-tested."

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }

[features]
default = []
