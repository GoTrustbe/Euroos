[package]
name = "europkg"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroPkg — pakketbeheerder (plan M2 + 3E-6): semver-versies + constraints, dependency-resolutie (topologisch, conflict/cyclus-detectie), getekende manifesten + install/remove/upgrade op een content-addressed store. no_std, host-testbaar."

[dependencies]

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"

[features]
default = []
