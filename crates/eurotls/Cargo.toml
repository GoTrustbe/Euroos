[package]
name = "eurotls"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroTLS — eigen TLS 1.3-client (Track 4/7). no_std + alloc, host-testbaar met RFC 8448-vectoren."

[dependencies]
# Pure-Rust RustCrypto-bouwstenen — no_std, dezelfde familie die ed25519-dalek
# al in de kernel compileert.
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
# Handtekening-verificatie van servercertificaten (plan A1, fase 2).
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
ed25519-dalek = { version = "2", default-features = false }
# Bignum modexp voor RSASSA-PKCS1-v1_5-verificatie (s^e mod n).
crypto-bigint = { version = "0.5", default-features = false }
