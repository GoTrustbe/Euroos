[package]
name = "euroverity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroVerity — dm-verity-style block integrity: a SHA-256 Merkle tree over a read-only system image, its root bound in an Ed25519-signed manifest. no_std, host-tested."

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }

[features]
default = []
