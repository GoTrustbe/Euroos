[package]
name = "europack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroPack v2: a signed container for large files served from a disk. Ed25519-signed manifest, per-file SHA-256 Merkle roots over 4 KiB pages, so every page is verified as it is read. no_std, host-tested."

[dependencies]
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false }
