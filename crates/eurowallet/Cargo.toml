[package]
name = "eurowallet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroWallet — eIDAS 2.0 / EUDI-wallet credentials: SD-JWT VC (selective disclosure) with EdDSA. no_std, host-tested against the IETF SD-JWT reference values."

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.10", default-features = false }

[features]
default = []
