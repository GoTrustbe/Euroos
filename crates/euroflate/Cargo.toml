[package]
name = "euroflate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroFlate — from-scratch no_std DEFLATE/INFLATE (RFC 1951) + zlib/gzip wrappers. INFLATE decodes real zlib streams (stored/fixed/dynamic Huffman); DEFLATE emits valid fixed-Huffman streams real tools read. Underpins real .docx/.xlsx/.pptx ZIP containers."

