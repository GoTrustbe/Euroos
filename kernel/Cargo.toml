[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "EuroKernel — bootable UEFI kernel (Track 1)."

[[bin]]
name = "eurokernel"
path = "src/main.rs"

