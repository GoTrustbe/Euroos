# Kernelmodus (Track 3.2+):
x86_64 = "0.15"                       # GDT/IDT/poort-I/O structuren (HW-abstractie, geen kernel)
linked_list_allocator = "0.10"        # kernel-heap; wordt later EuroMM's eigen slab (Track 3.4)
spin = "0.9"                          # no_std mutex voor globale staat
pic8259 = "0.11"                      # 8259 PIC remap (timer/keyboard IRQ's)
ed25519-dalek = { version = "2", default-features = false }
# Audit #11: `force-soft` kiest sha2's portable software-backend i.p.v. de SIMD-
# variant. Feature-unificatie past dit toe op ÉLKE sha2 in de boom — fixt de debug-
# build-codegen-crash op het UEFI-target en vermijdt AVX op bare metal. (Identiek
# effect als de curve25519/poly1305-cfg's in .cargo/config.toml.)
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
ab_glyph = { version = "0.2", default-features = false, features = ["libm"] }   # no_std TTF/OTF AA-rasterizer (modern font-rendering)
