name: CI
on: [push, pull_request]

# Cancel superseded runs on the same ref so failures don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The gate: pure host-logic tests. The ~50 euro* libraries compile under std
  #    and test without a VM — the reliable signal that must stay green.
  tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component rust-src
          rustup default nightly-2026-05-31
      - name: cargo test (host)
        run: cargo test

  # ── Informational only (continue-on-error): clippy lints drift between nightly
  #    versions, so -D warnings must never block a green run.
  lint:
    name: Clippy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + clippy
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component clippy
          rustup default nightly-2026-05-31
      - run: cargo clippy -p eurofs -p euronet -- -D warnings

  # ── Informational only: the UEFI kernel build uses -Z build-std (nightly-
  #    sensitive) and a headless QEMU boot (no KVM on hosted runners → slow TCG).
  #    Useful as an artifact, not a gate.
  kernel-boot:
    name: Kernel build + QEMU boot (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + build-std prerequisites
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component rust-src --target x86_64-unknown-uefi
          rustup default nightly-2026-05-31
      - name: Build the UEFI kernel
        run: cargo kbuild-release
      - name: Image + headless QEMU boot + screenshot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dosfstools mtools
          ./scripts/build.sh release
          python3 scripts/screenshot.py eurokernel.img boot.png 90 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-screenshot
          path: boot.png
