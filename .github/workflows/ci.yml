name: CI
on: [push, pull_request]

# Cancel superseded runs on the same ref so failures don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The gate: pure host-logic tests. The ~50 euro* libraries compile under std
  #    and test without a VM — the reliable signal that must stay green.
  tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component rust-src
          rustup default nightly-2026-05-31
      - name: cargo test (host)
        run: cargo test

  # ── CRA (Cyber Resilience Act) evidence: a machine-readable CycloneDX SBOM for
  #    every build, deterministic (reproducible from the committed Cargo.lock) and
  #    self-validated. Uploaded as an artifact + attached to releases. This is the
  #    Annex II obligation; it must exist before the 11 Sep 2026 reporting date.
  sbom:
    name: SBOM (CycloneDX, CRA Annex II)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component rust-src
          rustup default nightly-2026-05-31
      - name: Generate the SBOM
        run: |
          python3 toolchain/sbom/gen-sbom.py \
            --version "${GITHUB_REF_NAME:-alpha}" \
            --timestamp "$(git log -1 --format=%cI)" \
            -o sbom.cdx.json
      - name: Validate the SBOM (structural CycloneDX 1.5 check)
        run: python3 toolchain/sbom/gen-sbom.py --check sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
      - name: Attach the SBOM to a release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.cdx.json

  # ── Fuzz the untrusted-input parsers (must never panic on malformed input) —
  #    the fuzzing half of the CRA "security testing" evidence (3G-4). Runs the
  #    deterministic eurofuzz harness (seeded → any failure is replayable).
  fuzz:
    name: Fuzz parsers (eurofuzz, CRA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component rust-src
          rustup default nightly-2026-05-31
      - name: Run the fuzz harness (200k iterations/parser)
        run: cargo test -p eurofuzz --release

  # ── Informational only (continue-on-error): clippy lints drift between nightly
  #    versions, so -D warnings must never block a green run.
  lint:
    name: Clippy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + clippy
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component clippy
          rustup default nightly-2026-05-31
      - run: cargo clippy -p eurofs -p euronet -- -D warnings

  # ── 3E-4: reproducible-build check. Builds the UEFI kernel TWICE with the
  #    reproducibility flags (--remap-path-prefix + lld /Brepro to zero the PE
  #    timestamp) and asserts the two eurokernel.efi hashes are byte-identical.
  #    Informational for now: build-std across toolchain minor versions can still
  #    drift, so this reports rather than gates (see docs/CRA-CONFORMANCE.md).
  repro-check:
    name: Reproducible build (3E-4, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + build-std prerequisites
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component rust-src --target x86_64-unknown-uefi
          rustup default nightly-2026-05-31
      - name: Build twice and compare kernel hashes
        run: |
          ./scripts/repro-build.sh
          H1=$(sha256sum target/x86_64-unknown-uefi/release/eurokernel.efi | cut -d' ' -f1)
          rm -f target/x86_64-unknown-uefi/release/eurokernel.efi
          touch kernel/src/main.rs
          ./scripts/repro-build.sh
          H2=$(sha256sum target/x86_64-unknown-uefi/release/eurokernel.efi | cut -d' ' -f1)
          echo "build #1: $H1"
          echo "build #2: $H2"
          test "$H1" = "$H2" && echo "REPRODUCIBLE ✓" || { echo "NON-REPRODUCIBLE ✗"; exit 1; }

  # ── 3E-4: signed release pipeline. On a tag: build the reproducible image,
  #    generate a signed release manifest (source commit → binary hashes, Ed25519
  #    with the dev key from a repo secret) + the SBOM, and attach all of it to
  #    the GitHub release. This is the source-commit → binary-hash → signed
  #    manifest chain the plan calls for.
  release:
    name: Signed release (3E-4)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + build-std prerequisites
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component rust-src --target x86_64-unknown-uefi
          rustup default nightly-2026-05-31
      - name: Build the signed userland + reproducible kernel + image
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools qemu-system-x86 ovmf dosfstools mtools
          python3 toolchain/eupkg/gen-dev-key.py
          ./userland/build.sh
          ./scripts/repro-build.sh
          ./scripts/build.sh release
      - name: Provide the release signing key
        env:
          EUROOS_DEV_KEY: ${{ secrets.EUROOS_DEV_KEY }}
        run: |
          # The private Ed25519 seed is a repo secret (base64). Absent on forks →
          # the manifest is generated unsigned (the step still succeeds).
          if [ -n "${EUROOS_DEV_KEY:-}" ]; then
            echo "$EUROOS_DEV_KEY" | base64 -d > toolchain/eupkg/keys/dev.key
          fi
      - name: Generate the signed release manifest + SBOM
        run: |
          python3 toolchain/sbom/gen-sbom.py --version "$GITHUB_REF_NAME" \
            --timestamp "$(git log -1 --format=%cI)" -o sbom.cdx.json
          python3 toolchain/release/make-release-manifest.py \
            --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --toolchain nightly-2026-05-31 --timestamp "$(git log -1 --format=%cI)" \
            --out release-manifest.json \
            target/x86_64-unknown-uefi/release/eurokernel.efi \
            target/x86_64-unknown-uefi/release/loader.efi \
            eurokernel.img
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            eurokernel.img
            release-manifest.json
            release-manifest.json.sig
            sbom.cdx.json

  # ── Informational only: the UEFI kernel build uses -Z build-std (now pinned,
  #    see rust-toolchain.toml) and a headless QEMU boot (no KVM on hosted
  #    runners → slow TCG). Useful as an artifact, not a gate.
  kernel-boot:
    name: Kernel build + QEMU boot (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly + build-std prerequisites
        run: |
          rustup toolchain install nightly-2026-05-31 --profile minimal --component rust-src --target x86_64-unknown-uefi
          rustup default nightly-2026-05-31
      - name: Build userland ELFs + the UEFI kernel
        run: |
          # The kernel include_bytes!()'s the userland/*.elf(+.elf.sig) programs
          # plus dev.pub. The .elf/.sig are git-ignored build output, and the
          # private signing seed (dev.key) is deliberately NOT in the repo, so:
          #   1. install musl-tools — 19 of the 33 programs are musl static-PIE
          #      (without it userland/build.sh silently skips them);
          #   2. generate a fresh dev keypair (dev.key + matching dev.pub) exactly
          #      as CONTRIBUTING.md documents, so sign.py can sign the userland;
          #   3. build the signed userland, then kbuild (which embeds .elf/.sig).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          python3 toolchain/eupkg/gen-dev-key.py
          ./userland/build.sh
          cargo kbuild-release
      - name: Image + headless QEMU boot + screenshot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dosfstools mtools
          ./scripts/build.sh release
          python3 scripts/screenshot.py eurokernel.img boot.png 90 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-screenshot
          path: boot.png
